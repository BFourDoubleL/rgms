<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RGMS · Supabase Connection Check</title>
  <style>
    body{font:16px/1.6 system-ui,sans-serif;max-width:760px;margin:48px auto;padding:0 20px;color:#172033}
    .card{border:1px solid #d8dee9;border-radius:14px;padding:22px}
    button{padding:10px 16px;border:0;border-radius:8px;background:#851419;color:#fff;cursor:pointer}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fa;padding:14px;border-radius:8px}
    .muted{color:#64748b}
  </style>
</head>
<body>
  <h1>RGMS · ตรวจสอบการเชื่อมต่อ Supabase</h1>
  <p class="muted">หน้านี้ทดสอบเฉพาะการโหลดค่าตั้งค่าและการเชื่อมต่อแบบไม่เปิดเผย Secret</p>
  <section class="card">
    <p id="status">กำลังเริ่มต้น...</p>
    <button id="test" disabled>ทดสอบอ่านตาราง schools</button>
    <pre id="output">รอผลการตรวจสอบ</pre>
  </section>
  <script type="module">
    const status = document.querySelector("#status");
    const button = document.querySelector("#test");
    const output = document.querySelector("#output");

    try {
      const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
      const response = await fetch("/api/supabase-config", { cache: "no-store" });
      if (!response.ok) throw new Error((await response.json()).error || `Config endpoint: ${response.status}`);
      const config = await response.json();
      const supabase = createClient(config.supabaseUrl, config.publishableKey);
      status.textContent = "โหลดการตั้งค่าได้แล้ว · พร้อมทดสอบ Database";
      button.disabled = false;

      button.addEventListener("click", async () => {
        button.disabled = true;
        output.textContent = "กำลังอ่าน schools...";
        const { data, error } = await supabase.from("schools").select("code,name").limit(10);
        if (error) {
          output.textContent = `อ่านตารางไม่สำเร็จ: ${error.message}\n\nตรวจสอบว่า Migration ถูก Run แล้ว, มีตาราง schools และ RLS อนุญาตการอ่านสำหรับ authenticated users`;
        } else {
          output.textContent = JSON.stringify(data, null, 2);
        }
        button.disabled = false;
      });
    } catch (error) {
      status.textContent = "เชื่อมต่อไม่สำเร็จ";
      output.textContent = `${error.message}\n\nตรวจสอบ Root Directory ของ Vercel, API route /api/supabase-config และ Environment Variables`;
    }
  </script>
</body>
</html>
